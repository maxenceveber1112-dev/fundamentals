<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundamental — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0b0d17;--surface:#111320;--surface-2:#171a2e;--surface-3:#1d2038;
      --border:#252845;--border-hover:#363a68;
      --text:#e2e4f0;--text-muted:#8b90b8;--text-faint:#444868;
      --violet:#818cf8;--purple:#c084fc;--indigo:#6366f1;
      --indigo-dim:rgba(99,102,241,0.14);
      --green:#4ade80;--green-dim:rgba(74,222,128,0.10);
      --red:#f87171;
      --r-sm:0.5rem;--r-md:0.875rem;--r-lg:1.25rem;--r-xl:1.75rem;--r-full:9999px;
      --ease-spring:cubic-bezier(0.34,1.56,0.64,1);--ease-out:cubic-bezier(0.16,1,0.3,1);--t:180ms;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-font-smoothing:antialiased;}
    body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
    #bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.18;}

    .card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:2.25rem;display:flex;flex-direction:column;gap:1.75rem;}

    /* LOGO */
    .logo-wrap{display:flex;align-items:center;justify-content:center;gap:0.625rem;}
    .logo-text{font-weight:900;font-size:1.2rem;background:linear-gradient(135deg,var(--violet),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

    /* TABS */
    .tabs{display:flex;background:var(--surface-2);border-radius:var(--r-full);padding:0.25rem;gap:0.25rem;}
    .tab{flex:1;padding:0.5rem;border-radius:var(--r-full);font-size:0.82rem;font-weight:600;color:var(--text-muted);text-align:center;cursor:pointer;border:none;background:none;font-family:inherit;transition:background var(--t),color var(--t);}
    .tab.active{background:var(--surface-3);color:#fff;border:1px solid var(--border);}

    /* FORM */
    .form-group{display:flex;flex-direction:column;gap:0.35rem;}
    label{font-size:0.78rem;font-weight:600;color:var(--text-muted);}
    input[type=email],input[type=password]{
      width:100%;padding:0.75rem 1rem;
      background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
      color:var(--text);font-size:0.9rem;font-family:inherit;
      transition:border-color var(--t),box-shadow var(--t);
      outline:none;
    }
    input:focus{border-color:rgba(99,102,241,0.5);box-shadow:0 0 0 3px rgba(99,102,241,0.12);}
    input.error{border-color:var(--red);}

    /* BOUTONS */
    .btn-primary{display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.875rem;border-radius:var(--r-full);background:linear-gradient(135deg,var(--indigo),var(--purple));font-size:0.9rem;font-weight:700;color:#fff;border:none;cursor:pointer;box-shadow:0 0 24px rgba(99,102,241,0.3);transition:box-shadow var(--t),transform 0.1s;width:100%;font-family:inherit;}
    .btn-primary:hover{box-shadow:0 0 36px rgba(99,102,241,0.45);}
    .btn-primary:active{transform:scale(0.98);}
    .btn-primary:disabled{opacity:0.55;cursor:not-allowed;}

    .btn-google{display:flex;align-items:center;justify-content:center;gap:0.625rem;padding:0.8rem;border-radius:var(--r-full);background:var(--surface-2);border:1px solid var(--border);font-size:0.875rem;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;width:100%;transition:border-color var(--t),background var(--t);}
    .btn-google:hover{border-color:var(--border-hover);background:var(--surface-3);}

    /* DIVIDER */
    .divider{display:flex;align-items:center;gap:0.75rem;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .divider span{font-size:0.72rem;color:var(--text-faint);}

    /* ERROR / SUCCESS messages */
    .msg{padding:0.75rem 1rem;border-radius:var(--r-md);font-size:0.82rem;font-weight:500;display:none;}
    .msg.show{display:block;}
    .msg.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--red);}
    .msg.success{background:var(--green-dim);border:1px solid rgba(74,222,128,0.3);color:var(--green);}

    .footer-note{text-align:center;font-size:0.72rem;color:var(--text-faint);}
    .footer-note a{color:var(--violet);text-decoration:none;}
    .footer-note a:hover{text-decoration:underline;}

    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="card">
  <!-- Logo -->
  <div class="logo-wrap">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs>
      <rect x="3" y="3" width="8" height="8" rx="2" fill="url(#lg)"/>
      <rect x="13" y="3" width="8" height="8" rx="2" fill="url(#lg)" opacity=".5"/>
      <rect x="3" y="13" width="8" height="8" rx="2" fill="url(#lg)" opacity=".5"/>
      <rect x="13" y="13" width="8" height="8" rx="2" fill="url(#lg)" opacity=".25"/>
    </svg>
    <span class="logo-text">Fundamental</span>
  </div>

  <!-- Tabs -->
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-login"  onclick="setTab('login')"  role="tab" aria-selected="true">Se connecter</button>
    <button class="tab"        id="tab-signup" onclick="setTab('signup')" role="tab" aria-selected="false">Créer un compte</button>
  </div>

  <!-- Messages -->
  <div class="msg error"   id="msg-error"></div>
  <div class="msg success" id="msg-success"></div>

  <!-- Form -->
  <form id="auth-form" onsubmit="handleSubmit(event)" novalidate>
    <div style="display:flex;flex-direction:column;gap:1rem;">
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="prenom@exemple.fr" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" minlength="8" />
      </div>
      <!-- Champ confirmation uniquement pour l'inscription -->
      <div class="form-group" id="confirm-group" style="display:none;">
        <label for="confirm">Confirmer le mot de passe</label>
        <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary" id="btn-submit">
        <span id="btn-label">Se connecter</span>
      </button>
    </div>
  </form>

  <!-- Divider -->
  <div class="divider"><span>ou</span></div>

  <!-- Google -->
  <button class="btn-google" onclick="handleGoogle()">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continuer avec Google
  </button>

  <p class="footer-note">
    Groupe bêta fermé. <a href="mailto:hello@fundamental.app">Demander un accès</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script src="supabase.js"></script>
<script>
  initBgCanvas('bg-canvas');

  // Redirect if already logged in
  (async () => {
    const user = await getCurrentUser();
    if (user) redirectAfterLogin();
  })();

  let currentTab = 'login';

  function setTab(tab) {
    currentTab = tab;
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('tab-login').setAttribute('aria-selected', tab === 'login');
    document.getElementById('tab-signup').setAttribute('aria-selected', tab === 'signup');
    document.getElementById('confirm-group').style.display = tab === 'signup' ? '' : 'none';
    document.getElementById('btn-label').textContent = tab === 'login' ? 'Se connecter' : 'Créer mon compte';
    document.getElementById('password').setAttribute('autocomplete', tab === 'login' ? 'current-password' : 'new-password');
    clearMessages();
  }

  function showError(msg) {
    const el = document.getElementById('msg-error');
    el.textContent = msg; el.classList.add('show');
    document.getElementById('msg-success').classList.remove('show');
  }
  function showSuccess(msg) {
    const el = document.getElementById('msg-success');
    el.textContent = msg; el.classList.add('show');
    document.getElementById('msg-error').classList.remove('show');
  }
  function clearMessages() {
    document.getElementById('msg-error').classList.remove('show');
    document.getElementById('msg-success').classList.remove('show');
  }

  function setLoading(loading) {
    const btn = document.getElementById('btn-submit');
    const lbl = document.getElementById('btn-label');
    btn.disabled = loading;
    lbl.innerHTML = loading
      ? '<div class="spinner"></div>'
      : (currentTab === 'login' ? 'Se connecter' : 'Créer mon compte');
  }

  async function handleSubmit(e) {
    e.preventDefault();
    clearMessages();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    if (!email || !password) { showError('Remplis tous les champs.'); return; }
    if (password.length < 8) { showError('Le mot de passe doit faire au moins 8 caractères.'); return; }
    if (currentTab === 'signup' && password !== confirm) { showError('Les mots de passe ne correspondent pas.'); return; }

    setLoading(true);

    if (currentTab === 'login') {
      const { user, error } = await signInWithEmail(email, password);
      if (error) { showError(getErrorLabel(error)); setLoading(false); return; }
      redirectAfterLogin();
    } else {
      const { user, error } = await signUpWithEmail(email, password);
      if (error) { showError(getErrorLabel(error)); setLoading(false); return; }
      showSuccess('Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse.');
      setLoading(false);
    }
  }

  async function handleGoogle() {
    clearMessages();
    await signInWithGoogle();
  }

  function getErrorLabel(msg) {
    if (!msg) return 'Une erreur est survenue.';
    if (msg.includes('Invalid login credentials')) return 'Email ou mot de passe incorrect.';
    if (msg.includes('Email not confirmed')) return 'Confirme ton adresse e-mail d\'abord.';
    if (msg.includes('User already registered')) return 'Ce compte existe déjà. Connecte-toi.';
    if (msg.includes('Password should be at least')) return 'Le mot de passe est trop court.';
    return msg;
  }

  function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    window.location.href = next && next.startsWith('/') ? next : 'index.html';
  }
</script>
</body>
</html>
