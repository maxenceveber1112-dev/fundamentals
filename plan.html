<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Fundamentals</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="robots" content="noindex"/>
  <!--
    « Mon parcours » a fusionné avec le tableau de bord :
      · la vue d'ensemble du parcours  → « Voir tout », groupé par phase
      · « Ajuster mon plan »           → en-tête de « Mes briques à venir »
    Page conservée en redirection pour ne casser aucun lien ni favori.
  -->
  <script>window.location.replace('dashboard.html');</script>
  <meta http-equiv="refresh" content="0; url=dashboard.html"/>

  <style>
    /* Respecter le reglage systeme « reduire les animations ». Sans cela,
       les fondus et deplacements de cette page s'imposaient a des
       personnes qui ont explicitement demande a en etre dispensees —
       vertiges, migraines, troubles vestibulaires. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

  <style>
    /* Titre destine aux lecteurs d'ecran. Il ne doit PAS utiliser
       display:none ni visibility:hidden, qui le retireraient aussi de
       l'arbre d'accessibilite : on le sort du cadre visible en gardant
       une taille non nulle. */
    .f-sr-only {
      position:absolute !important; width:1px; height:1px;
      padding:0; margin:-1px; overflow:hidden;
      clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0;
    }
  </style>
</head>
<body style="margin:0;font-family:system-ui,-apple-system,sans-serif;">
<h1 class="f-sr-only">Ton parcours</h1>
  <p style="padding:1.5rem;font-size:0.95rem;">
    Cette page a fusionné avec le <a href="dashboard.html">tableau de bord</a>.
  </p>

<!-- Cloudflare Web Analytics — sans cookie, sans suivi individuel, donc
     sans bandeau de consentement a ajouter. Le jeton identifie le site,
     ce n'est pas un secret. Pour retirer la mesure : supprimer ces deux
     lignes ici et sur les autres pages, et retirer les deux domaines
     cloudflareinsights du CSP dans netlify.toml. -->
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "741e03f5f567432bb91b463b2f45bc94"}'></script>
<script src="acces.js?v=2"></script>
</body>
</html>
