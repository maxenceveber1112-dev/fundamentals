[build]
  publish = "."

# Racine du site : la page de connexion sert d'accueil.
# status 200 = reecriture, pas redirection : l'URL affichee reste "/".
[[redirects]]
  from = "/"
  to = "/auth.html"
  status = 200
  # force = true est INDISPENSABLE : un fichier index.html existe a la
  # racine du dossier publie, et sur Netlify un fichier physique l'emporte
  # sur une reecriture non forcee. Sans lui, "/" servait l'onboarding.
  force = true

# Chemin inconnu : on atterrit sur la connexion plutot qu'au milieu de
# l'onboarding. Un visiteur deja connecte y est redirige vers son dashboard.
# force = false : les fichiers reels (index.html, simulateur-*.html, les
# briques...) restent servis directement et repondent 200.
[[redirects]]
  from = "/*"
  to = "/auth.html"
  # status 404 et non 200 : une URL inconnue qui repond 200 est un
  # « soft 404 », que Google signale et qui laisse indexer n'importe
  # quelle URL fantaisiste. Le visiteur, lui, voit toujours la page de
  # connexion : seul le code de statut change.
  status = 404
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://avnxkfthqgeehcjuxoej.supabase.co https://api-adresse.data.gouv.fr https://public.opendatasoft.com wss://avnxkfthqgeehcjuxoej.supabase.co https://cloudflareinsights.com; img-src 'self' data: blob:; frame-ancestors 'self'"

# ── Cache-Control ──
# Pas de hash dans les noms de fichiers → on revalide systématiquement
# (ETag Netlify → 304 si inchangé) pour éviter de servir du code obsolète.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
