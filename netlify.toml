[build]
  publish = "."

# L'ancien sous-domaine Netlify redirige vers le domaine principal.
# Sans cela, deux adresses servent le meme site : Google peut indexer les
# deux, et la mesure d'audience se retrouve eclatee entre les deux hotes.
# La regle vise l'hote EXACT — les previsualisations de deploiement, sur
# <hash>--fundamentals-beta.netlify.app, restent consultables.
[[redirects]]
  from = "https://fundamentals-beta.netlify.app/*"
  to = "https://fundamentals-education.com/:splat"
  status = 301
  force = true

# Racine du site : la page de connexion sert d'accueil.
# status 200 = reecriture, pas redirection : l'URL affichee reste "/".
[[redirects]]
  from = "/"
  to = "/auth.html"
  status = 200
  # force = true est INDISPENSABLE : un fichier index.html existe a la
  # racine du dossier publie, et sur Netlify un fichier physique l'emporte
  # sur une reecriture non forcee. Sans lui, "/" servait l'onboarding.
  force = true

# Chemin inconnu : une vraie page 404, qui dit ce qui s'est passe et
# propose trois issues. Elle servait la page de connexion jusqu'ici, ce qui
# laissait le visiteur devant un formulaire sans un mot d'explication.
# force = false : les fichiers reels (index.html, simulateur-*.html, les
# briques...) restent servis directement et repondent 200.
[[redirects]]
  from = "/*"
  to = "/404.html"
  # status 404 et non 200 : une URL inconnue qui repond 200 est un
  # « soft 404 », que Google signale et qui laisse indexer n'importe
  # quelle URL fantaisiste. Le visiteur, lui, voit toujours la page de
  # connexion : seul le code de statut change.
  status = 404
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://avnxkfthqgeehcjuxoej.supabase.co https://api-adresse.data.gouv.fr https://public.opendatasoft.com wss://avnxkfthqgeehcjuxoej.supabase.co https://cloudflareinsights.com; img-src 'self' data: blob:; frame-ancestors 'self'"
    # Le site n'utilise ni caméra, ni micro, ni géolocalisation, ni capteurs.
    # On le declare, plutot que de laisser la porte ouverte par defaut.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

# ── Cache-Control ──
# Pas de hash dans les noms de fichiers → on revalide systématiquement
# (ETag Netlify → 304 si inchangé) pour éviter de servir du code obsolète.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Les polices ne changent jamais sous un meme nom de fichier : on les met
# en cache longtemps. Pour REMPLACER une police, il faut donc RENOMMER le
# fichier (et l'URL dans fonts.css), sinon les navigateurs garderont
# l'ancienne version pendant un an.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
