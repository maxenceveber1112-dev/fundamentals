<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>immo-core.js — tests</title>
  <style>
    body { font-family: ui-monospace, Menlo, Consolas, monospace; background:#0b0b1a; color:#e5e5e5; padding:1.5rem; line-height:1.5; }
    h1 { font-size:1.1rem; }
    .ok { color:#4ade80; }
    .fail { color:#f87171; font-weight:700; }
    #summary { font-size:1.05rem; margin:1rem 0; padding:.6rem 1rem; border-radius:8px; }
    #summary.pass { background:rgba(74,222,128,.12); }
    #summary.failbg { background:rgba(248,113,113,.15); }
    .row { white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>immo-core.js — suite de tests (cas de référence)</h1>
  <div id="summary">Chargement…</div>
  <div id="out"></div>

  <script src="immo-core.js"></script>
  <script>
  (function(){
    var out = document.getElementById('out');
    var passed = 0, failed = 0;
    function approx(a, b, tol){ return Math.abs(a - b) <= (tol || 0.5); }
    function check(name, cond, detail){
      var div = document.createElement('div');
      div.className = 'row ' + (cond ? 'ok' : 'fail');
      div.textContent = (cond ? '✓ ' : '✗ ') + name + (cond ? '' : '  → ' + (detail||''));
      out.appendChild(div);
      cond ? passed++ : failed++;
    }

    // calculateMonthlyPayment
    var m = calculateMonthlyPayment(160000, 3, 300);
    check('calculateMonthlyPayment(160000,3,300) ≈ 758,87', approx(m, 758.87, 1.5), m);
    check('calculateMonthlyPayment(100000,0,240) = 416,67 (taux 0)', approx(calculateMonthlyPayment(100000,0,240), 416.67, 0.5), calculateMonthlyPayment(100000,0,240));
    check('calculateMonthlyPayment(0,3,300) = 0', calculateMonthlyPayment(0,3,300) === 0);

    // calculateBorrowingCapacity (inverse)
    var cap = calculateBorrowingCapacity(m, 3, 300);
    check('calculateBorrowingCapacity inverse de payment ≈ 160000', approx(cap, 160000, 5), cap);

    // estimateAcquisitionFees
    check('estimateAcquisitionFees(200000,"ancien") = 14000 (7%)', estimateAcquisitionFees(200000,'ancien') === 14000, estimateAcquisitionFees(200000,'ancien'));
    check('estimateAcquisitionFees(200000,"neuf") = 5000 (2,5%)', estimateAcquisitionFees(200000,'neuf') === 5000, estimateAcquisitionFees(200000,'neuf'));
    check('estimateAcquisitionFees(50000,"ancien") = 5000 (<75k → 10%)', estimateAcquisitionFees(50000,'ancien') === 5000, estimateAcquisitionFees(50000,'ancien'));
    check('estimateAcquisitionFees(0) = 0', estimateAcquisitionFees(0,'ancien') === 0);

    // calculateDebtRatio
    check('calculateDebtRatio(500,1000,3000) = 0,5', approx(calculateDebtRatio(500,1000,3000), 0.5, 0.0001), calculateDebtRatio(500,1000,3000));
    check('calculateDebtRatio(_,_,0) = 0', calculateDebtRatio(500,1000,0) === 0);

    // calculateMobilizableDownPayment
    check('calculateMobilizableDownPayment(40000,5000,6000,0,0) = 39000', calculateMobilizableDownPayment(40000,5000,6000,0,0) === 39000, calculateMobilizableDownPayment(40000,5000,6000,0,0));
    check('calculateMobilizableDownPayment négatif → 0', calculateMobilizableDownPayment(1000,0,5000,0,0) === 0);

    // n()
    check('n("abc") = 0', n('abc') === 0);
    check('n("3.5") = 3.5', n('3.5') === 3.5);
    check('n("") = 0', n('') === 0);
    check('n(undefined) = 0', n(undefined) === 0);

    // fmt / fmtPct
    check('fmt(NaN) = "--"', fmt(NaN) === '--');
    check('fmt(1234) est une string €', typeof fmt(1234) === 'string' && fmt(1234) !== '--' && /\d/.test(fmt(1234)), fmt(1234));
    check('fmtPct(0.055) = "5.5 %"', fmtPct(0.055) === '5.5 %', fmtPct(0.055));

    // getDeptFromPostal
    check('getDeptFromPostal("97400") = "974"', getDeptFromPostal('97400') === '974', getDeptFromPostal('97400'));
    check('getDeptFromPostal("69003") = "69"', getDeptFromPostal('69003') === '69', getDeptFromPostal('69003'));
    check('getDeptFromPostal("") = null', getDeptFromPostal('') === null);

    // getPrixM2
    check('getPrixM2("75001") > 0 (Paris)', getPrixM2('75001') > 0, getPrixM2('75001'));
    check('getPrixM2("00000") = default', getPrixM2('00000') === (typeof PRIX_M2 !== 'undefined' ? PRIX_M2['default'] : null), getPrixM2('00000'));

    // getTypoById / estimateTypoPrice
    var t = getTypoById('t2');
    check('getTypoById("t2").id = "t2"', t && t.id === 't2', t && t.id);
    check('getTypoById("zzz") = fallback (objet)', !!getTypoById('zzz') && typeof getTypoById('zzz') === 'object');
    check('estimateTypoPrice({surface:50,mult:1},3000) = 150000', estimateTypoPrice({surface:50,mult:1},3000) === 150000, estimateTypoPrice({surface:50,mult:1},3000));

    // constants present
    check('EFFORT_MAX = 0.35', typeof EFFORT_MAX !== 'undefined' && EFFORT_MAX === 0.35);
    check('ASSURANCE_RATES défini', typeof ASSURANCE_RATES === 'object' && ASSURANCE_RATES['25_34'] === 0.0020);
    check('DUREE_PAR_AGE défini', typeof DUREE_PAR_AGE === 'object' && DUREE_PAR_AGE['25_34'] === 25);

    var s = document.getElementById('summary');
    s.textContent = (failed === 0 ? '✅ TOUS LES TESTS PASSENT' : '❌ ' + failed + ' ÉCHEC(S)') + ' — ' + passed + ' OK / ' + (passed+failed) + ' total';
    s.className = failed === 0 ? 'pass' : 'failbg';
    window.__TESTS__ = { passed: passed, failed: failed };
  })();
  </script>
</body>
</html>
