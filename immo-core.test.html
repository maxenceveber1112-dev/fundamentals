<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>immo-core.js — tests</title>
  <style>
    body { font-family: ui-monospace, Menlo, Consolas, monospace; background:#0b0b1a; color:#e5e5e5; padding:1.5rem; line-height:1.5; }
    h1 { font-size:1.1rem; }
    .ok { color:#4ade80; }
    .fail { color:#f87171; font-weight:700; }
    #summary { font-size:1.05rem; margin:1rem 0; padding:.6rem 1rem; border-radius:8px; }
    #summary.pass { background:rgba(74,222,128,.12); }
    #summary.failbg { background:rgba(248,113,113,.15); }
    .row { white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>immo-core.js — suite de tests (cas de référence)</h1>
  <div id="summary">Chargement…</div>
  <div id="out"></div>

  <script src="immo-core.js?v=core4"></script>
  <script>
  (function(){
    var out = document.getElementById('out');
    var passed = 0, failed = 0;
    function approx(a, b, tol){ return Math.abs(a - b) <= (tol || 0.5); }
    function check(name, cond, detail){
      var div = document.createElement('div');
      div.className = 'row ' + (cond ? 'ok' : 'fail');
      div.textContent = (cond ? '✓ ' : '✗ ') + name + (cond ? '' : '  → ' + (detail||''));
      out.appendChild(div);
      cond ? passed++ : failed++;
    }

    // calculateMonthlyPayment
    var m = calculateMonthlyPayment(160000, 3, 300);
    check('calculateMonthlyPayment(160000,3,300) ≈ 758,87', approx(m, 758.87, 1.5), m);
    check('calculateMonthlyPayment(100000,0,240) = 416,67 (taux 0)', approx(calculateMonthlyPayment(100000,0,240), 416.67, 0.5), calculateMonthlyPayment(100000,0,240));
    check('calculateMonthlyPayment(0,3,300) = 0', calculateMonthlyPayment(0,3,300) === 0);

    // calculateBorrowingCapacity (inverse)
    var cap = calculateBorrowingCapacity(m, 3, 300);
    check('calculateBorrowingCapacity inverse de payment ≈ 160000', approx(cap, 160000, 5), cap);

    // estimateAcquisitionFees
    check('frais ancien 200 000 suit NOTARY_RATE_ANCIEN', estimateAcquisitionFees(200000,'ancien') === Math.round(200000*NOTARY_RATE_ANCIEN), estimateAcquisitionFees(200000,'ancien'));
    check('estimateAcquisitionFees(200000,"neuf") = 5000 (2,5%)', estimateAcquisitionFees(200000,'neuf') === 5000, estimateAcquisitionFees(200000,'neuf'));
    check('estimateAcquisitionFees(50000,"ancien") = 5000 (<75k → 10%)', estimateAcquisitionFees(50000,'ancien') === 5000, estimateAcquisitionFees(50000,'ancien'));
    check('estimateAcquisitionFees(0) = 0', estimateAcquisitionFees(0,'ancien') === 0);

    // calculateDebtRatio
    check('calculateDebtRatio(500,1000,3000) = 0,5', approx(calculateDebtRatio(500,1000,3000), 0.5, 0.0001), calculateDebtRatio(500,1000,3000));
    check('calculateDebtRatio(_,_,0) = 0', calculateDebtRatio(500,1000,0) === 0);

    // calculateMobilizableDownPayment
    check('calculateMobilizableDownPayment(40000,5000,6000,0,0) = 39000', calculateMobilizableDownPayment(40000,5000,6000,0,0) === 39000, calculateMobilizableDownPayment(40000,5000,6000,0,0));
    check('calculateMobilizableDownPayment négatif → 0', calculateMobilizableDownPayment(1000,0,5000,0,0) === 0);

    // n()
    check('n("abc") = 0', n('abc') === 0);
    check('n("3.5") = 3.5', n('3.5') === 3.5);
    check('n("") = 0', n('') === 0);
    check('n(undefined) = 0', n(undefined) === 0);

    // fmt / fmtPct
    check('fmt(NaN) = "--"', fmt(NaN) === '--');
    check('fmt(1234) est une string €', typeof fmt(1234) === 'string' && fmt(1234) !== '--' && /\d/.test(fmt(1234)), fmt(1234));
    check('fmtPct(0.055) = "5.5 %"', fmtPct(0.055) === '5.5 %', fmtPct(0.055));

    // getDeptFromPostal
    check('getDeptFromPostal("97400") = "974"', getDeptFromPostal('97400') === '974', getDeptFromPostal('97400'));
    check('getDeptFromPostal("69003") = "69"', getDeptFromPostal('69003') === '69', getDeptFromPostal('69003'));
    check('getDeptFromPostal("") = null', getDeptFromPostal('') === null);

    // La Corse : codes postaux en 20xxx, departements nommes 2A / 2B.
    check('getDeptFromPostal("20000") = "2A" (Ajaccio)', getDeptFromPostal('20000') === '2A', getDeptFromPostal('20000'));
    check('getDeptFromPostal("20200") = "2B" (Bastia)', getDeptFromPostal('20200') === '2B', getDeptFromPostal('20200'));
    check('getDeptFromPostal("20620") = "2B"', getDeptFromPostal('20620') === '2B', getDeptFromPostal('20620'));

    // getPrixM2
    check('getPrixM2("75001") > 0 (Paris)', getPrixM2('75001') > 0, getPrixM2('75001'));
    check('getPrixM2("00000") = default', getPrixM2('00000') === (typeof PRIX_M2 !== 'undefined' ? PRIX_M2['default'] : null), getPrixM2('00000'));
    check('getPrixM2("20000") ne retombe pas sur le defaut', getPrixM2('20000') !== PRIX_M2['default'] && getPrixM2('20000') === PRIX_M2['2A'], getPrixM2('20000'));
    check('getPrixM2("20200") = prix 2B', getPrixM2('20200') === PRIX_M2['2B'], getPrixM2('20200'));
    check('DEPT_NAMES couvre tout PRIX_M2', Object.keys(PRIX_M2).filter(function(k){return k!=='default' && !DEPT_NAMES[k];}).length === 0);

    // estimateAcquisitionFees — le type de bien prime sur le seuil bas
    check('frais neuf 60 000 = 2,5 % (pas 10 %)', estimateAcquisitionFees(60000,'neuf') === Math.round(60000*NOTARY_RATE_NEUF), estimateAcquisitionFees(60000,'neuf'));
    check('frais ancien 60 000 = 10 % (seuil bas)', estimateAcquisitionFees(60000,'ancien') === Math.round(60000*NOTARY_RATE_LOW), estimateAcquisitionFees(60000,'ancien'));
    // Le seuil est a 85 000 EUR : on le borne des deux cotes, sinon un
    // deplacement du seuil passerait inapercu.
    check('frais ancien 84 999 = encore 10 %', estimateAcquisitionFees(84999,'ancien') === Math.round(84999*NOTARY_RATE_LOW), estimateAcquisitionFees(84999,'ancien'));
    check('frais ancien 85 000 pile = 7,5 %', estimateAcquisitionFees(85000,'ancien') === Math.round(85000*NOTARY_RATE_ANCIEN), estimateAcquisitionFees(85000,'ancien'));
    check('le seuil vaut bien 85 000', PRICE_THRESHOLD_LOW === 85000, PRICE_THRESHOLD_LOW);
    check('le taux ancien vaut bien 7,5 %', NOTARY_RATE_ANCIEN === 0.075, NOTARY_RATE_ANCIEN);
    check('frais ancien 200 000 = 7,5 %', estimateAcquisitionFees(200000,'ancien') === Math.round(200000*NOTARY_RATE_ANCIEN), estimateAcquisitionFees(200000,'ancien'));
    check('frais neuf 200 000 = 2,5 %', estimateAcquisitionFees(200000,'neuf') === Math.round(200000*NOTARY_RATE_NEUF), estimateAcquisitionFees(200000,'neuf'));
    check('frais prix nul = 0', estimateAcquisitionFees(0,'ancien') === 0);
    check('taux ancien dans la fourchette annoncee 7-8 %', NOTARY_RATE_ANCIEN >= 0.07 && NOTARY_RATE_ANCIEN <= 0.08, NOTARY_RATE_ANCIEN);

    // getTypoById / estimateTypoPrice
    var t = getTypoById('t2');
    check('getTypoById("t2").id = "t2"', t && t.id === 't2', t && t.id);
    check('getTypoById("zzz") = fallback (objet)', !!getTypoById('zzz') && typeof getTypoById('zzz') === 'object');
    check('estimateTypoPrice({surface:50,mult:1},3000) = 150000', estimateTypoPrice({surface:50,mult:1},3000) === 150000, estimateTypoPrice({surface:50,mult:1},3000));

    // ─── Rendement locatif et cash-flow ───────────────────────────────
    // check() attend une CONDITION, pas une valeur attendue.
    // La vacance est en MOIS de loyer perdus par an : 0,5 mois = 1/24e.
    check('vacance 0 : loyer effectif = loyer', loyerEffectifMensuel(800, 0) === 800, loyerEffectifMensuel(800, 0));
    check('vacance 0,5 mois retire 1/24e', Math.round(loyerEffectifMensuel(800, 0.5)) === Math.round(800 - 800/24), loyerEffectifMensuel(800, 0.5));
    check('vacance 12 mois : plus rien', loyerEffectifMensuel(800, 12) === 0, loyerEffectifMensuel(800, 12));
    check('vacance au-dela de 12 est bornee', loyerEffectifMensuel(800, 99) === 0, loyerEffectifMensuel(800, 99));
    check('vacance negative ignoree', loyerEffectifMensuel(800, -3) === 800, loyerEffectifMensuel(800, -3));
    check('loyer nul : rien a perdre', loyerEffectifMensuel(0, 0.5) === 0, loyerEffectifMensuel(0, 0.5));

    check('rendement brut 800/mois sur 200 000 = 4,8 %', Math.abs(rendementBrut(800, 200000) - 4.8) < 0.001, rendementBrut(800, 200000));
    check('prix nul : pas de division par zero', rendementBrut(800, 0) === 0, rendementBrut(800, 0));

    // Le rendement mesure l'ACTIF : il ignore le financement et se rapporte au
    // cout TOTAL. Payer 20 000 de frais ne rapporte pas un euro de loyer de
    // plus, mais immobilise bien 20 000.
    check('rendement net = (loyer - charges) x12 / cout total',
          Math.abs(rendementNet(800, 250, 220000) - 3.0) < 0.001, rendementNet(800, 250, 220000));
    check('les frais font baisser le rendement net',
          rendementNet(800, 250, 220000) < rendementNet(800, 250, 200000));
    check('cout total nul : pas de division par zero', rendementNet(800, 250, 0) === 0, rendementNet(800, 250, 0));
    check('charges superieures au loyer : rendement negatif', rendementNet(800, 900, 200000) < 0, rendementNet(800, 900, 200000));

    // Le cash-flow, lui, INCLUT le financement. Confondre les deux donnerait
    // un chiffre credible et faux.
    check('cash-flow = loyer effectif - mensualite - assurance - charges',
          cashFlowMensuel(800, 700, 25, 225) === -150, cashFlowMensuel(800, 700, 25, 225));
    check('cash-flow positif si le loyer couvre tout', cashFlowMensuel(1000, 700, 25, 225) === 50, cashFlowMensuel(1000, 700, 25, 225));
    check('la mensualite deplace le cash-flow, pas le rendement',
          cashFlowMensuel(800, 700, 25, 250) !== cashFlowMensuel(800, 900, 25, 250)
          && rendementNet(800, 250, 220000) === rendementNet(800, 250, 220000));

    // constants present
    check('EFFORT_MAX = 0.35', typeof EFFORT_MAX !== 'undefined' && EFFORT_MAX === 0.35);
    check('ASSURANCE_RATES défini', typeof ASSURANCE_RATES === 'object' && ASSURANCE_RATES['25_34'] === 0.0020);
    check('DUREE_PAR_AGE défini', typeof DUREE_PAR_AGE === 'object' && DUREE_PAR_AGE['25_34'] === 25);

    var s = document.getElementById('summary');
    s.textContent = (failed === 0 ? '✅ TOUS LES TESTS PASSENT' : '❌ ' + failed + ' ÉCHEC(S)') + ' — ' + passed + ' OK / ' + (passed+failed) + ' total';
    s.className = failed === 0 ? 'pass' : 'failbg';
    window.__TESTS__ = { passed: passed, failed: failed };
  })();
  </script>
</body>
</html>
